# 密钥泄露扫描（gitleaks）— P0-2 安全加固
# 与北斗/璇玑同源；区别：天宫只扫「本次改动引入的提交」，不扫全量历史——
# 历史里那批已轮换作废的旧凭据（aae50a3 等）不会再触发红线，
# 而任何新引入的真实凭据仍会被拦截。
name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (new changes only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Determine scan base (new changes only)
        id: base
        run: |
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # 首次推送/新建分支时 before 为空或全 0 → 退化为只扫最近一个提交
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD~1"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Scanning range: $BASE..HEAD"

      - name: Scan new changes
        run: |
          ./gitleaks detect \
            --source . \
            --log-opts="${{ steps.base.outputs.base }}..HEAD" \
            --no-banner --redact -v
