# 最小可用 CI：只跑已知全绿的 scoped 测试，不跑全量套件（避免无关红）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scoped-tests:
    name: scoped tests (sso-signing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 按锁文件最小安装；--ignore-scripts 防构建脚本意外；锁文件失配时退化为免装脚本安装
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --no-save --ignore-scripts

      - name: Run scoped tests
        run: npx vitest run tests/sso-signing.test.ts
